services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15435:5432"
    volumes:
      - exploration_final_project_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - exploration_final_project_qdrant_data:/qdrant/storage

  redis:
    image: redis:7.2.4
    restart: always
    ports:
      - "16379:6379"

volumes:
  exploration_final_project_postgres_data:
    name: exploration_final_project_postgres_data
  exploration_final_project_qdrant_data:
    name: exploration_final_project_qdrant_data
